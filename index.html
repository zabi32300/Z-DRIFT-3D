<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Z DRIFT - Made by Zohaib</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Arial}
canvas{display:block}
#start{
position:fixed;inset:0;
background:radial-gradient(circle at center,#16224d,#000 80%);
display:flex;flex-direction:column;align-items:center;justify-content:center;
z-index:100;color:#fff;text-align:center
}
#start h1{font-size:80px;font-weight:900;letter-spacing:2px}
#start h1 b{color:#ff3c00;text-shadow:0 0 20px #ff3c00}
.made{color:#00e5ff;font-weight:900;margin-top:10px;letter-spacing:3px;font-size:18px}
#startBtn{
margin-top:35px;padding:18px 65px;background:#ff3c00;border:none;
border-radius:40px;color:#fff;font-size:22px;font-weight:900;
box-shadow:0 0 25px #ff3c00;
}
#ui{position:fixed;top:0;left:0;width:100%;padding:12px 15px;display:flex;justify-content:space-between;color:#00e5ff;font-weight:900;z-index:10;font-size:14px}
</style>
</head>
<body>
<div id="start">
<h1><b>Z</b> DRIFT</h1>
<div class="made">Made by Zohaib</div>
<button id="startBtn">START ENGINE</button>
</div>

<div id="ui"><span>Made by Zohaib</span><span id="speed">0 KM/H</span></div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('start');
const startBtn = document.getElementById('startBtn');

let W,H, running=false, speed=6, carX, road=0, traffic=[];
let left=false, right=false;

function resize(){
 W = canvas.width = window.innerWidth;
 H = canvas.height = window.innerHeight;
 carX = W/2;
}
resize();
window.addEventListener('resize', resize);

startBtn.onclick = function(){
 startScreen.style.display = 'none';
 running = true;
 loop();
 setInterval(()=>{
  if(running){
   let lane = Math.random() > 0.5 ? W*0.3 : W*0.7;
   traffic.push({x:lane, y:-120});
  }
 }, 900);
};

// Controls - PC + Mobile
window.addEventListener('keydown', e=>{
 if(e.key=='ArrowLeft') left=true;
 if(e.key=='ArrowRight') right=true;
});
window.addEventListener('keyup', e=>{
 if(e.key=='ArrowLeft') left=false;
 if(e.key=='ArrowRight') right=false;
});
canvas.addEventListener('touchstart', e=>{
 let x = e.touches[0].clientX;
 if(x < W/2) left=true; else right=true;
});
canvas.addEventListener('touchend', ()=>{
 left=false; right=false;
});

function loop(){
 if(!running) return;
 
 // Road
 ctx.fillStyle = '#222';
 ctx.fillRect(W*0.1, 0, W*0.8, H);
 ctx.fillStyle = '#333';
 ctx.fillRect(0,0,W*0.1,H);
 ctx.fillRect(W*0.9,0,W*0.1,H);

 // Lines
 ctx.strokeStyle = '#fff';
 ctx.lineWidth = 4;
 ctx.setLineDash([40,40]);
 ctx.lineDashOffset = -road;
 ctx.beginPath();
 ctx.moveTo(W/2, 0);
 ctx.lineTo(W/2, H);
 ctx.stroke();
 ctx.setLineDash([]);
 road += speed;

 // Car Move
 if(left) carX -= 8;
 if(right) carX += 8;
 carX = Math.max(W*0.15, Math.min(W*0.85, carX));

 // Traffic
 traffic.forEach((t,i)=>{
  t.y += speed + 2;
  ctx.fillStyle = '#ffeb3b';
  ctx.fillRect(t.x-28, t.y-45, 56, 90);
  ctx.fillStyle = '#000';
  ctx.fillRect(t.x-28, t.y-20, 56, 10);
  
  if(Math.abs(t.x - carX) < 45 && Math.abs(t.y - (H-120)) < 65){
   running=false;
   alert('CRASHED! Score: ' + Math.floor(speed*10));
   location.reload();
  }
  if(t.y > H+100) traffic.splice(i,1);
 });

 // Player Car
 ctx.fillStyle = '#ff3c00';
 ctx.fillRect(carX-32, H-130, 64, 100);
 ctx.fillStyle = '#00e5ff';
 ctx.fillRect(carX-24, H-110, 48, 25);
 ctx.fillStyle = '#111';
 ctx.fillRect(carX-36, H-60, 14, 25);
 ctx.fillRect(carX+22, H-60, 14, 25);

 document.getElementById('speed').innerText = Math.floor(speed*22) + ' KM/H';
 speed += 0.01;
 requestAnimationFrame(loop);
}
</script>
</body>
</html>
